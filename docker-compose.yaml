networks:
  default:
    driver: bridge
    name: expense
    external: false
volumes:
  mysql:
services:
    mysql:
      image: viswanadhammanchem/emysql:v1
      container_name: emysql
      volumes:
      - mysql:/var/lib/mysql

    backend:
      image: viswanadhammanchem/backend:v1
      container_name: backend
      depends_on:
      - emysql